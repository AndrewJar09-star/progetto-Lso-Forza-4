name: forza4-lso

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: forza4-server
    ports:
      - "8888:8888"
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    depends_on:
      - server
    stdin_open: true
    tty: true
    environment:
      - TERM=xterm-256color
